<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #2563eb, #9333ea);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h2 { color: #1e293b; margin-bottom: 15px; }
    input {
      width: 100%; padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%; padding: 12px;
      background: linear-gradient(90deg, #2563eb, #9333ea);
      color: #fff; border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset Password</h2>
    <form id="resetForm">
      <input type="password" id="password" placeholder="🔒 New password" required>
      <input type="password" id="confirmPassword" placeholder="🔒 Confirm password" required>
      <button type="submit">Reset Password</button>
    </form>
  </div>

  <script>
    const backendURL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" ? "http://localhost:5000" : window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const resetForm = document.getElementById("resetForm");

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      try {
        const res = await fetch(`${backendURL}/api/password/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (res.ok) {
          alert(data.message);
          // Redirect to login page
          window.location.href = "/login.html?fromReset=true";
        } else {
          alert(data.message || "Something went wrong");
        }
      } catch (err) {
        console.error("Error:", err);
        alert("Network error. Make sure the backend is running and CORS is enabled.");
      }
    });
  </script>
</body>
</html>
