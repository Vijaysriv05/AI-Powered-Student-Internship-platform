<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Reset Successful - AI-Intern</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #2563eb, #9333ea);
    }
    .success-card {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: popIn 0.8s ease;
    }
    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: inline-block;
      border: 4px solid #4ade80;
      position: relative;
      margin-bottom: 20px;
      animation: popIn 0.6s ease;
    }
    .checkmark::after {
      content: '';
      position: absolute;
      left: 20px;
      top: 40px;
      width: 18px;
      height: 8px;
      border-left: 4px solid #4ade80;
      border-bottom: 4px solid #4ade80;
      transform: rotate(-45deg);
      animation: drawCheck 0.5s ease forwards 0.3s;
    }
    h2 {
      margin: 0 0 10px;
      color: #1e293b;
    }
    p {
      color: #64748b;
      margin-bottom: 25px;
      font-size: 14px;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes drawCheck {
      from { width: 0; height: 0; }
      to { width: 18px; height: 8px; }
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="checkmark"></div>
    <h2>Password Reset Successful!</h2>
    <p>You will be redirected to login in <span id="countdown">5</span> seconds ⏳</p>
  </div>

  <script>
    let countdown = document.getElementById("countdown");
    let seconds = 5;

    let interval = setInterval(() => {
      seconds--;
      countdown.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = "login.html"; // redirect to login
      }
    }, 1000);
  </script>
</body>
</html>
