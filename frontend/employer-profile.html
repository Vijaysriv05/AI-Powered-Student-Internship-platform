<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Profile | AI-Intern</title>
<style>
  body { margin:0; font-family:'Segoe UI',sans-serif; background:#f3f4f6; }
  header { background:linear-gradient(90deg,#2563eb,#9333ea); padding:15px 30px; color:#fff; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:20px; }
  header a { color:#fff; text-decoration:none; font-weight:bold; transition: color 0.3s, transform 0.3s; }
  header a:hover { color:#ffeb3b; transform: scale(1.05); }

  main { padding:30px; max-width:900px; margin:auto; display:flex; flex-direction:column; gap:20px; }

  .profile-card { background:#fff; border-radius:12px; padding:25px; box-shadow:0 5px 15px rgba(0,0,0,0.1); display:flex; gap:30px; flex-wrap:wrap; transition: transform 0.3s, box-shadow 0.3s; }
  .profile-card:hover { transform: translateY(-3px); box-shadow:0 12px 25px rgba(0,0,0,0.15); }

  .profile-left { flex:1; min-width:250px; text-align:center; }
  .profile-left img { width:140px; height:140px; border-radius:12px; object-fit:cover; margin-bottom:15px; cursor:pointer; transition:0.4s; }
  .profile-left img:hover { transform: scale(1.08); box-shadow:0 8px 20px rgba(0,0,0,0.2); }
  .profile-left input { display:none; }

  .profile-right { flex:2; min-width:300px; }
  .profile-right h3 { color:#2563eb; margin-bottom:10px; }
  .profile-details { display:flex; flex-direction:column; gap:15px; }
  .profile-details label { font-weight:bold; margin-bottom:5px; display:block; }
  .profile-details input, .profile-details textarea { width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; font-size:14px; transition:0.3s; }
  .profile-details input:focus, .profile-details textarea:focus { border-color:#9333ea; box-shadow:0 0 8px rgba(147,51,234,0.3); outline:none; }
  .profile-details textarea { resize:vertical; min-height:80px; }

  .save-btn, .upload-btn { margin-top:10px; padding:12px 20px; font-size:16px; font-weight:bold; border:none; border-radius:10px; background:linear-gradient(90deg,#2563eb,#9333ea); color:#fff; cursor:pointer; transition:0.3s, transform 0.3s, box-shadow 0.3s; }
  .save-btn:hover, .upload-btn:hover { transform:translateY(-3px) scale(1.05); box-shadow:0 8px 20px rgba(0,0,0,0.25); background:linear-gradient(90deg,#9333ea,#ff6fff); }

  .progress-bar { background:#e0e0e0; border-radius:12px; overflow:hidden; height:20px; width:100%; margin-bottom:10px; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#2563eb,#9333ea); text-align:right; color:#fff; padding-right:5px; line-height:20px; font-weight:bold; width:0%; transition: width 0.3s, background 0.3s; }

  @media(max-width:900px){ .profile-card{ flex-direction:column; align-items:center; } }
</style>
</head>
<body>

<header>
  <h1>Employer Profile</h1>
  <a href="employers.html">Back to Dashboard</a>
</header>

<main>
  <div class="profile-card">
    <!-- Left Side: Logo -->
    <div class="profile-left">
      <img id="logo" src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Company Logo" title="Click to change">
      <input type="file" id="logoUpload" accept="image/*">
      <div class="progress-bar">
        <div class="progress-fill" id="profileCompletion">0%</div>
      </div>
    </div>

    <!-- Right Side: Company Details -->
    <div class="profile-right">
      <div class="profile-details">
        <div>
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" placeholder="Enter company name">
        </div>
        <div>
          <label for="companyEmail">Email</label>
          <input type="email" id="companyEmail" placeholder="Enter company email">
        </div>
        <div>
          <label for="industry">Industry</label>
          <input type="text" id="industry" placeholder="Enter industry">
        </div>
        <div>
          <label for="website">Website</label>
          <input type="url" id="website" placeholder="Enter website URL">
        </div>
        <div>
          <label for="employees">Number of Employees</label>
          <input type="number" id="employees" placeholder="Enter number of employees">
        </div>
        <div>
          <label for="description">Company Description</label>
          <textarea id="description" placeholder="Enter company description"></textarea>
        </div>
      </div>

      <button class="save-btn" id="saveProfile">Save Changes</button>
    </div>
  </div>
</main>

<script>
  const fields = ["companyName","companyEmail","industry","website","employees","description"];

  function loadEmployerProfile(){
    const logo = localStorage.getItem("companyLogo") || "https://cdn-icons-png.flaticon.com/512/732/732200.png";
    document.getElementById("logo").src = logo;

    fields.forEach(id=>{
      document.getElementById(id).value = localStorage.getItem(id) || "";
    });

    updateProfileCompletion();
  }

  // ---------------- Employer Dashboard: Load Stats ----------------
async function loadEmployerStats() {
  const token = localStorage.getItem("token");
  if (!token) return;

  try {
    const res = await fetch("/api/employers/stats", {
      headers: { Authorization: "Bearer " + token }
    });
    if (!res.ok) throw new Error("Failed to load stats");
    const data = await res.json();

    // update the numbers on the dashboard
    document.getElementById("jobCount").textContent = data.jobCount ?? 0;
    document.getElementById("applicantCount").textContent = data.applicantCount ?? 0;
  } catch (err) {
    console.error("Error loading stats:", err);
  }
}


  function updateProfileCompletion(){
    let completed = 0;
    if(localStorage.getItem("companyLogo")) completed++;
    fields.forEach(id=>{
      if(localStorage.getItem(id) && localStorage.getItem(id).trim() !== "") completed++;
    });
    const percent = Math.round((completed/(fields.length+1))*100);
    const bar = document.getElementById("profileCompletion");
    bar.style.width = percent + "%";
    bar.textContent = percent + "%";
  }

  document.getElementById("logo").addEventListener("click",()=>document.getElementById("logoUpload").click());
  document.getElementById("logoUpload").addEventListener("change",e=>{
    const file = e.target.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = ()=>{
        document.getElementById("logo").src = reader.result;
        localStorage.setItem("companyLogo", reader.result);
        updateProfileCompletion();
      };
      reader.readAsDataURL(file);
    }
  });

  // Save all fields live
  fields.forEach(id=>{
    const input = document.getElementById(id);
    input.addEventListener("input", ()=>{
      localStorage.setItem(id, input.value);
      updateProfileCompletion();
    });
  });

  document.getElementById("saveProfile").addEventListener("click", ()=>{
    alert("Profile saved successfully!");
    updateProfileCompletion();
  });

  document.addEventListener("DOMContentLoaded", loadEmployerProfile);
    document.addEventListener("DOMContentLoaded",  loadEmployerStats);
</script>

</body>
</html>
