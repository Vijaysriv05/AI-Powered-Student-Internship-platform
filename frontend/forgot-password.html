<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #2563eb, #9333ea);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h2 { color: #1e293b; margin-bottom: 15px; }
    p { color: #334155; font-size: 14px; }
    input {
      width: 100%; padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      width: 100%; padding: 12px;
      background: linear-gradient(90deg, #2563eb, #9333ea);
      color: #fff; border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      opacity: 0.9;
    }
    .message {
      margin-top: 10px;
      font-size: 14px;
      color: green;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Forgot Password?</h2>
    <p>Enter your email and we'll send a reset link</p>
    <form id="forgotForm">
      <input type="email" id="email" placeholder="📧 Enter your email" required>
      <button type="submit">Send Reset Link</button>
    </form>
    <div id="msg" class="message"></div>
  </div>

  <script>
    const form = document.getElementById("forgotForm");
    const msgDiv = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgDiv.textContent = ""; // Clear previous messages

      const email = document.getElementById("email").value.trim();
      if (!email) {
        msgDiv.textContent = "Please enter your email.";
        msgDiv.classList.add("error");
        return;
      }

      try {
        const res = await fetch("http://localhost:5000/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
          msgDiv.textContent = data.message || "Check your email for the reset link.";
          msgDiv.classList.remove("error");
        } else {
          msgDiv.textContent = data.message || "Something went wrong.";
          msgDiv.classList.add("error");
        }

      } catch (err) {
        console.error("Error:", err);
        msgDiv.textContent = "Network error. Try again later.";
        msgDiv.classList.add("error");
      }
    });
  </script>
</body>
</html>
