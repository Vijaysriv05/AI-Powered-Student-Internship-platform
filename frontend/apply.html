<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Internship</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(90deg, #2563eb, #9333ea);
      padding: 15px;
      text-align: center;
      color: white;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #2563eb;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #111827;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>

  <header>Apply for Internship</header>

  <div class="container">
    <h2>Application Form</h2>
    <form id="applyForm">
      <label for="internship">Internship Role</label>
      <select id="internship" name="internship" required>
        <option value="">-- Select Internship --</option>
        <option value="Machine Learning Intern">Machine Learning Intern</option>
        <option value="UI/UX Design Intern">UI/UX Design Intern</option>
        <option value="Content Writer Intern">Content Writer Intern</option>
        <option value="Web Development Intern">Web Development Intern</option>
        <option value="Graphic Design Intern">Graphic Design Intern</option>
      </select>

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="resume">Resume Link (Google Drive/Dropbox)</label>
      <input type="url" id="resume" name="resume" placeholder="Paste your resume link" required>

      <label for="cover">Cover Letter</label>
      <textarea id="cover" name="cover" placeholder="Write a short cover letter"></textarea>

      <button type="submit">Submit Application</button>
    </form>
  </div>

  <script>
    // Auto-select internship from URL
    const urlParams = new URLSearchParams(window.location.search);
    const internship = urlParams.get("internship");
    if (internship) {
      document.getElementById("internship").value = internship;
    }

    // Handle form submit → open email draft
    document.getElementById("applyForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const internship = document.getElementById("internship").value;
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const resume = document.getElementById("resume").value;
      const cover = document.getElementById("cover").value;

      const subject = `Application for ${internship}`;
      const body = `Hello HR,%0D%0A%0D%0A` +
                   `I am applying for the role of **${internship}**.%0D%0A%0D%0A` +
                   `Name: ${name}%0D%0A` +
                   `Email: ${email}%0D%0A` +
                   `Resume: ${resume}%0D%0A%0D%0A` +
                   `Cover Letter:%0D%0A${cover}`;

      const mailtoLink = `mailto:hr@aiintern.com?subject=${encodeURIComponent(subject)}&body=${body}`;
      window.location.href = mailtoLink;
    });
  </script>

</body>
</html>
