<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google - AI Intern</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #f4f7ff, #e8efff);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      background: #fff;
      margin: 50px auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
    }
    h1 {
      color: #4285F4;
      margin-bottom: 15px;
    }
    p {
      font-size: 16px;
      margin: 10px 0;
      color: #555;
    }
    .btn {
      display: inline-block;
      padding: 12px 25px;
      margin: 15px 10px 0 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .btn-apply {
      background: #34A853;
      color: #fff;
    }
    .btn-apply:hover {
      background: #0F9D58;
    }
    .btn-back {
      background: #4285F4;
      color: #fff;
    }
    .btn-back:hover {
      background: #3367D6;
    }
    .highlight {
      font-weight: 700;
      color: #1a73e8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Google - AI Intern</h1>
    <p><span class="highlight">Location:</span> Mountain View, CA</p>
    <p><span class="highlight">Duration:</span> 3-6 months</p>
    <p><span class="highlight">Description:</span> Work with Google’s AI team on exciting machine learning projects. Gain hands-on experience in AI research, model building, and data analysis.</p>
    <a href="./students.html" class="btn btn-back">Back to Dashboard</a>
    <a href="./apply.html" class="btn btn-apply">Apply Now</a>
  </div>
</body>
</html>
