<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Institution Profile | AI-Intern</title>
<style>
body { margin:0; font-family:'Segoe UI',sans-serif; background:#f3f4f6; }
header { background:linear-gradient(90deg,#2563eb,#9333ea); padding:15px 30px; color:#fff; display:flex; justify-content:space-between; align-items:center; }
header a { color:#fff; text-decoration:none; font-weight:bold; transition:0.3s; }
header a:hover { color:#ffeb3b; transform:scale(1.05); }
main { padding:30px; max-width:900px; margin:auto; display:flex; flex-direction:column; gap:20px; }
.profile-card { background:#fff; border-radius:12px; padding:25px; box-shadow:0 5px 15px rgba(0,0,0,0.1); display:flex; gap:30px; align-items:flex-start; flex-wrap:wrap; }
.profile-left { flex:1; min-width:250px; text-align:center; }
.profile-left img { width:140px; height:140px; border-radius:50%; object-fit:cover; margin-bottom:15px; cursor:pointer; }
.profile-left input { display:none; }
.profile-left h2 { margin:5px 0; color:#2563eb; }
.profile-left p { margin:5px 0; color:#333; }
.profile-right { flex:2; min-width:300px; }
.profile-right h3 { color:#2563eb; margin-bottom:10px; }
.profile-details { display:flex; flex-direction:column; gap:15px; }
.profile-details label { font-weight:bold; margin-bottom:5px; display:block; }
.profile-details input, .profile-details textarea { width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; font-size:14px; transition:0.3s; }
.profile-details input:focus, .profile-details textarea:focus { border-color:#9333ea; box-shadow:0 0 8px rgba(147,51,234,0.3); outline:none; }
.save-btn, .file-upload-label { margin-top:10px; padding:12px 20px; font-size:16px; font-weight:bold; border:none; border-radius:10px; background:linear-gradient(90deg,#2563eb,#9333ea); color:#fff; cursor:pointer; transition:0.3s; display:inline-block; }
.save-btn:hover, .file-upload-label:hover { transform:scale(1.05); background:linear-gradient(90deg,#9333ea,#ff6fff); }
.progress-bar { background:#e0e0e0; border-radius:12px; overflow:hidden; height:20px; width:100%; margin-bottom:10px; }
.progress-fill { height:100%; background:linear-gradient(90deg,#2563eb,#9333ea); text-align:right; color:#fff; padding-right:5px; line-height:20px; font-weight:bold; width:0%; transition:width 1s ease-in-out; }
.certificates-section { margin-top:20px; }
.certificates-list { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
.certificate { background:#f3f4f6; padding:8px 12px; border-radius:8px; font-size:14px; color:#333; display:flex; justify-content:space-between; align-items:center; cursor:default; position:relative; }
.certificate .remove-cert { color:red; font-weight:bold; cursor:pointer; }
input[type="file"] { display:none; }
@media(max-width:900px){ .profile-card{ flex-direction:column; align-items:center; } }
</style>
</head>
<body>

<header>
  <h1>Institution Profile</h1>
  <a href="institutions.html">Back to Dashboard</a>
</header>

<main>
  <div class="profile-card">
    <div class="profile-left">
      <img id="profileLogo" src="https://cdn-icons-png.flaticon.com/512/235/235347.png" alt="Institution Logo" title="Click to change">
      <input type="file" id="logoUpload" accept="image/*">
      <h2 id="profileName">Loading...</h2>
      <p id="role">🏢 Institution</p>
      <div class="progress-bar">
        <div class="progress-fill" id="profileCompletion">0%</div>
      </div>
    </div>

    <div class="profile-right">
      <div class="profile-details">
        <div>
          <label for="institutionName">Name</label>
          <input type="text" id="institutionName">
        </div>
        <div>
          <label for="institutionEmail">Email</label>
          <input type="email" id="institutionEmail">
        </div>
        <div>
          <label for="domain">Domain</label>
          <input type="text" id="domain">
        </div>
        <div>
          <label for="website">Website</label>
          <input type="text" id="website">
        </div>
        <div>
          <label for="description">Description</label>
          <textarea id="description" rows="4"></textarea>
        </div>
      </div>

      <div class="certificates-section">
        <h3>Certificates / Documents</h3>
        <label class="file-upload-label" for="certUpload">Upload Document</label>
        <input type="file" id="certUpload" accept=".pdf,.jpg,.png,.doc,.docx">
        <div class="certificates-list" id="certificatesList"></div>
      </div>

      <button class="save-btn" id="saveProfile">Save Changes</button>
    </div>
  </div>
</main>
<script>
// ---------------- Auth Logic ----------------
const token = localStorage.getItem("token");
if (!token) {
    alert("Not logged in! Redirecting to login page...");
    window.location.href = "login.html";
}

// ---------------- Load Profile ----------------
async function loadProfile() {
    try {
        const res = await fetch("/api/auth/profile", {
            headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (!res.ok) {
            console.error("Profile load failed:", data.message);
            return;
        }

        const user = data.user;
        const profile = user.profile || {};

        // Update UI fields
        document.getElementById("institutionName").value = user.institutionName || user.name || "";
        document.getElementById("institutionEmail").value = user.email || "";
        document.getElementById("domain").value = user.institutionType || profile.domain || "";
        document.getElementById("website").value = user.website || profile.website || "";
        document.getElementById("description").value = user.institutionDescription || profile.description || "";
        
        const avatar = user.avatar || "https://cdn-icons-png.flaticon.com/512/235/235347.png";
        document.getElementById("profileLogo").src = avatar;
        document.getElementById("profileName").textContent = user.institutionName || user.name || "Institution";

        // Progress Calculation
        updateProfileCompletion(user);
        
        // Certificates (if any)
        const certs = profile.certificates || [];
        const list = document.getElementById("certificatesList");
        list.innerHTML = certs.map((c, i) => `
            <div class="certificate">
                <span>${c}</span>
                <span class="remove-cert" onclick="removeCertificate(${i})">&times;</span>
            </div>
        `).join("");

    } catch (err) {
        console.error("Error loading profile:", err);
    }
}

// ---------------- Save Profile ----------------
async function saveProfile() {
    const payload = {
        institutionName: document.getElementById("institutionName").value,
        institutionType: document.getElementById("domain").value,
        website: document.getElementById("website").value,
        institutionDescription: document.getElementById("description").value,
        avatar: document.getElementById("profileLogo").src
    };

    try {
        const res = await fetch("/api/auth/profile", {
            method: "PUT",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}` 
            },
            body: JSON.stringify(payload)
        });
        
        if (res.ok) {
            alert("✅ Profile updated successfully!");
            loadProfile();
        } else {
            const data = await res.json();
            alert("❌ Save failed: " + data.message);
        }
    } catch (err) {
        console.error("Save error:", err);
        alert("❌ Network error. Try again.");
    }
}

// ---------------- Helpers ----------------
function updateProfileCompletion(user) {
    let completed = 0, total = 5;
    if (user.institutionName || user.name) completed++;
    if (user.avatar) completed++;
    if (user.email) completed++;
    if (user.institutionType) completed++;
    if (user.website) completed++;
    
    const percent = Math.round((completed / total) * 100);
    const bar = document.getElementById("profileCompletion");
    bar.style.width = percent + "%";
    bar.textContent = percent + "%";
}

// Logo upload handler
document.getElementById("profileLogo").onclick = () => document.getElementById("logoUpload").click();
document.getElementById("logoUpload").onchange = function() {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => document.getElementById("profileLogo").src = reader.result;
    reader.readAsDataURL(file);
};

document.getElementById("saveProfile").onclick = saveProfile;
document.addEventListener("DOMContentLoaded", loadProfile);
</script>
</body>
</html>
</html>-->
