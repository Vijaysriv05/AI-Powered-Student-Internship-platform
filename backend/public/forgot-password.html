<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - AI-Intern</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #2563eb, #9333ea);
    }
    .forgot-card {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: slideUp 0.8s ease;
    }
    .forgot-card img {
      width: 70px;
      margin-bottom: 10px;
    }
    .forgot-card h2 {
      margin: 0 0 10px;
      color: #1e293b;
    }
    .forgot-card p {
      color: #64748b;
      margin-bottom: 20px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      transition: 0.3s;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 6px rgba(37,99,235,0.3);
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #2563eb, #9333ea);
      color: #fff;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
    .links {
      margin-top: 15px;
      font-size: 14px;
    }
    .links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .message {
      margin-top: 10px;
      font-size: 14px;
    }
    .message.success { color: green; }
    .message.error { color: red; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="forgot-card">
    <img src="https://cdn-icons-png.flaticon.com/512/565/565655.png" alt="forgot password">
    <h2>Forgot Password?</h2>
    <p>Enter your email to reset your password 🔑</p>
    
    <form id="forgotForm">
      <input type="email" id="email" placeholder="📧 Enter your email" required>
      <button type="submit">Send Reset Link</button>
    </form>

    <div class="message" id="msg"></div>

    <div class="links">
      <a href="login.html">⬅ Back to Login</a>
    </div>
  </div>

  <script>
    const backendURL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" ? "http://localhost:5000" : window.location.origin;
    const form = document.getElementById("forgotForm");
    const msgDiv = document.getElementById("msg");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      msgDiv.textContent = "";
      msgDiv.className = "message";

      const email = document.getElementById("email").value.trim();
      if (!email) {
        msgDiv.textContent = "Please enter your email.";
        msgDiv.classList.add("error");
        return;
      }

      try {
        const res = await fetch(`${backendURL}/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
          msgDiv.textContent = data.message || "✅ Check your email for the reset link.";
          msgDiv.classList.add("success");
        } else {
          msgDiv.textContent = data.message || "❌ Something went wrong.";
          msgDiv.classList.add("error");
        }

      } catch (err) {
        console.error(err);
        msgDiv.textContent = "❌ Network error. Make sure backend is running.";
        msgDiv.classList.add("error");
      }
    });
  </script>
</body>
</html>
