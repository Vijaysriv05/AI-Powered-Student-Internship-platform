<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Segoe UI', sans-serif; background: linear-gradient(120deg, #2563eb, #9333ea); }
    .reset-card { background:#fff; padding:40px; border-radius:16px; width:380px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
    input, button { width:100%; padding:12px; margin:8px 0; border-radius:10px; font-size:15px; }
    button { background: linear-gradient(90deg, #2563eb, #9333ea); color:#fff; border:none; cursor:pointer; }
    .message.success { color: green; }
    .message.error { color: red; }
  </style>
</head>
<body>
  <div class="reset-card">
    <h2>Reset Password</h2>
    <form id="resetForm">
      <input type="password" id="password" placeholder="New Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <button type="submit">Reset Password</button>
    </form>
    <div class="message" id="msg"></div>
  </div>

  <script>
    const backendURL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" ? "http://localhost:5000" : window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const resetForm = document.getElementById("resetForm");
    const msgDiv = document.getElementById("msg");

    resetForm.addEventListener("submit", async e => {
      e.preventDefault();
      msgDiv.textContent = "";
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      if (password !== confirmPassword) {
        msgDiv.textContent = "Passwords do not match!";
        msgDiv.className = "message error";
        return;
      }

      try {
        const res = await fetch(`${backendURL}/api/auth/password/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        msgDiv.textContent = data.message || "Password reset successful!";
        msgDiv.className = res.ok ? "message success" : "message error";
        if (res.ok) setTimeout(() => { window.location.href = "login.html"; }, 2000);
      } catch (err) {
        msgDiv.textContent = "Network error. Backend not running.";
        msgDiv.className = "message error";
      }
    });
  </script>
</body>
</html>
